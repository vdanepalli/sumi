<!DOCTYPE html><html><head><meta charset="utf-8"><title>Video page</title>
<style>body{font:16px Georgia;background:#f4f1ea;color:#222;max-width:900px;margin:40px auto}video{width:860px;height:480px;background:#111;display:block}</style></head>
<body><h1>A 3-hour lecture</h1><div id="player"><video id="v"></video></div>
<p>Dev test: the video's length and position are faked (3:00:00, at 1:26:10, 1.5×).</p>
<script src="/dev/mock-chrome.js"></script>
<script>
  // fake a long video without a media file
  const v = document.getElementById('v'); let t = 5170, d = 10800, rate = 1.5, paused = false;
  Object.defineProperties(v, { duration: { get: () => d }, currentTime: { get: () => t, set: x => { t = x; } }, playbackRate: { get: () => rate }, paused: { get: () => paused } });
  window.fakeVideo = { set: (o) => { if ('t' in o) t = o.t; if ('d' in o) d = o.d; if ('rate' in o) rate = o.rate; v.dispatchEvent(new Event('durationchange')); v.dispatchEvent(new Event('timeupdate')); } };
  setInterval(() => { t += 1; v.dispatchEvent(new Event('timeupdate')); }, 1000);
</script>
<script src="/content/video.js"></script></body></html>
