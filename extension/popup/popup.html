<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/lib/ui.css">
  <style>
    body { width: 340px; padding: 14px; }
    .sp { flex: 1; }
    .clockrow { display: flex; align-items: center; gap: 8px; }
    .clockrow .v { font: 300 32px/1 var(--ui); font-variant-numeric: tabular-nums; }
    .clockrow .m { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .clockrow button { padding: 6px 10px; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .grid2 button { font-size: 12.5px; }
    select { width: 100%; }
  </style>
</head>
<body>
  <div class="clockrow"><div><div class="m" id="tm">Focus</div><div class="v" id="tv">25:00</div></div><span class="sp"></span>
    <button class="primary" id="t-toggle">Start</button><button id="t-skip" title="Skip">⏭</button></div>
  <div class="clockrow" style="margin-top:10px"><div><div class="m">Stopwatch</div><div class="v" id="sv">0:00</div></div><span class="sp"></span>
    <button id="s-toggle">Start</button><button id="s-stop" title="Stop and save">■</button></div>
  <div class="small muted" id="today" style="margin-top:8px"></div>
  <hr>
  <div class="small muted" style="margin-bottom:6px">Save tabs to a collection</div>
  <select id="target"></select>
  <div class="grid2" style="margin-top:6px">
    <button id="save-tab">Save this tab</button>
    <button id="save-win" class="primary">Save window</button>
  </div>
  <hr>
  <div class="grid2" id="tools">
    <button data-t="dupes">Close duplicates</button>
    <button data-t="sleep">Sleep inactive</button>
  </div>
  <div class="row" style="margin-top:12px"><span class="small faint" id="site"></span><span class="sp"></span><button class="ghost" id="open">Open Sumi ↗</button></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
