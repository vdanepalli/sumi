<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/lib/ui.css">
  <style>
    html { background: #000; }
    /* search first; everything else is one or two rows. Tab tools live in the search (type "dup", "sleep", "video"...) */
    body { width: 400px; max-height: 590px; padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
    body > * { flex: none; }
    #palette { flex: 1 1 auto; min-height: 120px; display: flex; flex-direction: column; }
    #palette .pal { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    #palette .pal-list { flex: 1 1 auto; min-height: 0; max-height: 300px; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 0; }
    .r1 { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
    .r2 { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; }
    .r1 button, .r2 button { font-size: 12.5px; white-space: nowrap; }
    .clk { font-variant-numeric: tabular-nums; min-width: 92px; }
    .clk[hidden] { display: none; }
    select { min-width: 0; width: 100%; font-size: 12.5px; }
    .foot { display: flex; align-items: center; gap: 8px; }
    .foot .small { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <div id="palette"></div>
  <hr>
  <div class="r1">
    <button class="primary" id="save-later" title="Save this page to Later (Alt+Shift+L) · set a deadline in Sumi → Later">＋ Save to Later</button>
    <div class="row" style="gap:6px"><button class="clk" id="t-toggle" title="Focus timer: start / pause (Alt+Shift+P)">▶ 25:00</button>
      <button class="clk" id="s-toggle" title="Stopwatch: pause / resume (Alt+Shift+W)" hidden></button><button id="s-stop" title="Stop and save stopwatch" hidden>■</button></div>
  </div>
  <div class="r2">
    <select id="target" title="Collection to save into"></select>
    <button id="save-tab">Save tab</button>
    <button id="save-win">Save window</button>
  </div>
  <div class="foot"><span class="small faint" id="site"></span><button class="ghost small" id="open">Open Sumi ↗</button></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
